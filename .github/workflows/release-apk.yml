name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "R-Shop-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: R-Shop ${{ github.ref_name }}
          files: R-Shop-${{ github.ref_name }}.apk
          generate_release_notes: true
          body: |
            Fork build of R-Shop with handheld-focused changes.

            - Xbox and Xbox 360 systems
            - ZIP auto-extract off by default
            - Console settings persist when you leave a system
            - Keep Screen On (Settings → Display, on by default)

            If Android blocks the install over the official APK, uninstall that build first — this file is CI-signed, not the official key.
